---
layout: default
---

<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-meta">
            📅 Published: {{ page.date | date: "%B %d, %Y" }}
            {% if page.last_updated %}
                <br>🔄 Last updated: {{ page.last_updated | date: "%B %d, %Y" }}
            {% endif %}
        </p>
    </header>

    <div class="post-content">
        {{ content }}
    </div>
</article>
