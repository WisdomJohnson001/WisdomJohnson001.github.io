# Site settings
title: "Wisdom's Mechatronics Journey"
email: xionxul12@gmail.com
description: "Documenting my 5-year journey studying Mechatronics Engineering at FUNAAB"
baseurl: ""
url: "https://WisdomJohnson001.github.io"

# Social
twitter_username: jekyllrb
github_username: jekyll

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title.html

# Plugins
plugins:
  - jekyll-feed

# Collections
collections:
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
  - scope:
      path: "pages"
    values:
      layout: "default"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/